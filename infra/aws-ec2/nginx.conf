# MediHistory AI — Nginx reverse proxy config
# Place at: /etc/nginx/sites-available/medihistory
# Enable:   sudo ln -s /etc/nginx/sites-available/medihistory /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# Security:
# - HTTPS only (HTTP redirects to HTTPS)
# - TLS 1.2+ only
# - Security headers: HSTS, X-Frame-Options, X-Content-Type-Options, CSP
# - Access log disabled (medical data — no request paths logged)
# - Proxy passes to localhost:8000 only (backend not exposed directly)
#
# Replace YOUR_DOMAIN with your actual domain before enabling.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL — managed by Certbot (paths filled in by certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Permitted-Cross-Domain-Policies none always;

    # Access log DISABLED — medical app, never log request paths
    access_log off;
    error_log /var/log/nginx/medihistory_error.log warn;

    # Max upload size (prescription images / PDFs)
    client_max_body_size 20M;

    # Reverse proxy to FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — OCR processing can take 20-30s
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Don't pass internal IP in response headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Health check — no auth required, safe to expose
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block sensitive paths
    location ~ /\.(env|git|gitignore) {
        deny all;
        return 404;
    }
}
