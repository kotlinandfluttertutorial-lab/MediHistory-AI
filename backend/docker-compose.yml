# MediHistory AI — local development stack
#
# Usage:
#   docker compose up          — start all services
#   docker compose up -d       — detached
#   docker compose down -v     — stop and remove volumes
#
# Security:
# - All secrets are in .env (git-ignored) — never hardcoded here.
# - Copy .env.example → .env and fill in real values before first run.
# - The backend service never writes logs that contain patient data
#   (--no-access-log is set in the Dockerfile CMD).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medihistory}
      POSTGRES_USER: ${POSTGRES_USER:-medihistory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medihistory_user} -d ${POSTGRES_DB:-medihistory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port not exposed externally by default — only the backend container reaches it.

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Database — asyncpg driver for PostgreSQL
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medihistory_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medihistory}
      # Auth — must be set; server refuses to start without it
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # AI — optional; AI endpoints degrade gracefully when absent
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Upload storage — bind-mount for persistence across container restarts
      UPLOAD_DIR: /app/uploads
      WORKERS: ${WORKERS:-2}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
