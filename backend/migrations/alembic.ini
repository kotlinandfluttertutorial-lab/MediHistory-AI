# MediHistory AI — Alembic configuration.
# This file lives in backend/migrations/alembic.ini.
# Run migrations from the backend/ directory:
#   python -m alembic -c migrations/alembic.ini upgrade head

[alembic]
# Path to migration scripts, relative to this .ini file.
script_location = %(here)s

# sys.path entry — backend/ is the project root for imports.
prepend_sys_path = ..

# sqlalchemy.url is intentionally left as a placeholder here.
# The actual URL is supplied at runtime by env.py from the
# DATABASE_URL environment variable (default: sqlite+aiosqlite:///./medihistory.db).
sqlalchemy.url = placeholder

# Truncate slug length for generated file names.
truncate_slug_length = 40

version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
