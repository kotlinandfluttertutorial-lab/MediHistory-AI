name: Backend CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  backend-lint-and-test:
    name: Lint, Type Check, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Run ruff lint
        run: ruff check .
        working-directory: backend

      - name: Run black format check
        run: black --check .
        working-directory: backend

      - name: Run mypy type check
        run: mypy app/
        working-directory: backend

      - name: Run pytest with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html --cov-fail-under=90
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET: test-jwt-secret-for-ci-only-not-a-real-secret
          TESTING: "true"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

      - name: Security check — no hardcoded secrets
        run: |
          if grep -r --include="*.py" \
            -E '(SECRET_KEY|API_KEY|password|token)\s*=\s*"[^"]{8,}"' \
            app/; then
            echo "ERROR: Possible hardcoded secret found in Python source files"
            exit 1
          fi
          echo "Security check passed"
        working-directory: backend
