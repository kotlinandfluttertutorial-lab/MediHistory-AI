name: Android CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  android-lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        working-directory: ${{github.workspace}}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{runner.os}}-gradle-${{hashFiles('**/*.gradle*', '**/libs.versions.toml')}}
          restore-keys: |
            ${{runner.os}}-gradle-

      - name: Run lint
        run: ./gradlew lintDebug
        working-directory: android

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android
        env:
          BACKEND_BASE_URL: ${{vars.BACKEND_BASE_URL || 'http://localhost:8000'}}

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/

      - name: Security check — no hardcoded secrets
        run: |
          if grep -r --include="*.kt" --include="*.java" --include="*.xml" \
            -E '(api_key|apiKey|API_KEY|secret|password|token)\s*=\s*"[^"]{8,}"' \
            android/app/src/main/; then
            echo "ERROR: Possible hardcoded secret found in source files"
            exit 1
          fi
          echo "Security check passed: no obvious hardcoded secrets found"
