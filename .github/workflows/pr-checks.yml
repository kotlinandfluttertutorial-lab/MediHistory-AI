name: PR Gate — All Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-no-secrets-committed:
    name: Verify no secrets or env files committed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for committed .env files
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: .env file found in repository. Remove it and add to .gitignore."
            exit 1
          fi
          echo "No .env files committed — OK"

      - name: Check for google-services.json
        run: |
          if find . -name "google-services.json" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: google-services.json found in repository."
            exit 1
          fi
          echo "No google-services.json committed — OK"

      - name: Check for local.properties
        run: |
          if find . -name "local.properties" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: local.properties found in repository."
            exit 1
          fi
          echo "No local.properties committed — OK"

      - name: Check for .keystore files
        run: |
          if find . -name "*.keystore" -not -path "./.git/*" | grep -q .; then
            echo "ERROR: .keystore file found in repository."
            exit 1
          fi
          echo "No .keystore files committed — OK"

      - name: Check for hardcoded secrets in source files
        run: |
          pattern="(^|[^[:alnum:]_])(api[_-]?key|client[_-]?secret|password|passwd|secret|access[_-]?token|auth[_-]?token)[\"']?[[:space:]]*[:=][[:space:]]*[\"'][^\"']{8,}[\"']|(^|[^[:alnum:]_])ghp_[[:alnum:]]{20,}|(^|[^[:alnum:]_])github_pat_[[:alnum:]_]{20,}"
          if grep -rEil --exclude-dir=".git" \
            "$pattern" \
            --include="*.kt" --include="*.java" --include="*.xml" \
            --include="*.py" --include="*.properties" --include="*.yml" \
            --include="*.yaml" --include="*.json" \
            .; then
            echo "ERROR: Possible hardcoded credential found in the files listed above."
            exit 1
          fi
          echo "Credential scan passed — no hardcoded credentials found"

  android-ci:
    name: Android Lint and Unit Tests
    runs-on: ubuntu-latest
    needs: [ verify-no-secrets-committed ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{runner.os}}-gradle-${{hashFiles('**/*.gradle*', '**/libs.versions.toml')}}
          restore-keys: |
            ${{runner.os}}-gradle-

      - name: Run lint
        run: ./gradlew lintDebug
        working-directory: android

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android
        env:
          BACKEND_BASE_URL: ""
          ENABLE_CLOUD_BACKUP: "false"
          ENABLE_INTERACTION_CHECK: "false"

  backend-ci:
    name: Backend Lint, Type Check, and Tests
    runs-on: ubuntu-latest
    needs: [ verify-no-secrets-committed ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run ruff lint
        run: ruff check .
        working-directory: backend

      - name: Run black format check
        run: black --check .
        working-directory: backend

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=90
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET: test-jwt-secret-for-ci-only-not-a-real-secret
          TESTING: "true"

  pr-gate:
    name: All checks must pass to merge
    runs-on: ubuntu-latest
    needs: [ android-ci, backend-ci, verify-no-secrets-committed ]
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          ANDROID_RESULT: ${{ needs.android-ci.result }}
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          SECRETS_RESULT: ${{ needs.verify-no-secrets-committed.result }}
        run: |
          if [ "$ANDROID_RESULT" != "success" ] || \
             [ "$BACKEND_RESULT" != "success" ] || \
             [ "$SECRETS_RESULT" != "success" ]; then
            echo "One or more required checks failed. Merge blocked."
            exit 1
          fi
          echo "All PR checks passed. Safe to merge."
