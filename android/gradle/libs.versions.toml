[versions]
agp                = "8.4.2"
kotlin             = "1.9.24"
compose-bom        = "2024.06.00"
compose-compiler   = "1.5.14"
core-ktx           = "1.13.1"
lifecycle          = "2.8.2"
activity-compose   = "1.9.0"
material3          = "1.2.1"
hilt               = "2.51.1"
room               = "2.6.1"
navigation         = "2.7.7"
coroutines         = "1.8.1"
camerax            = "1.3.3"
work               = "2.9.0"
security-crypto    = "1.1.0-alpha06"
junit              = "4.13.2"
junit-ext          = "1.1.5"
espresso           = "3.5.1"
robolectric        = "4.12.2"
androidx-test-core = "1.6.1"

[libraries]
# AndroidX Core
androidx-core-ktx               = { group = "androidx.core",              name = "core-ktx",                        version.ref = "core-ktx" }

# Lifecycle
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",           version.ref = "lifecycle" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",         version.ref = "lifecycle" }

# Activity
androidx-activity-compose       = { group = "androidx.activity",          name = "activity-compose",                version.ref = "activity-compose" }

# Compose BOM + components
androidx-compose-bom                         = { group = "androidx.compose",           name = "compose-bom",                     version.ref = "compose-bom" }
androidx-compose-ui                          = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics                 = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling                  = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-tooling-preview          = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest            = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
androidx-compose-ui-test-junit4              = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-material3                   = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3" }
androidx-compose-material-icons-extended     = { group = "androidx.compose.material",  name = "material-icons-extended" }

# Navigation
androidx-navigation-compose     = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "navigation" }

# Hilt
hilt-android                    = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt" }
hilt-android-compiler           = { group = "com.google.dagger",           name = "hilt-android-compiler",           version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt",              name = "hilt-navigation-compose",         version = "1.2.0" }

# Room
androidx-room-runtime           = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room" }
androidx-room-ktx               = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room" }
androidx-room-compiler          = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room" }
androidx-room-testing           = { group = "androidx.room",               name = "room-testing",                    version.ref = "room" }

# Coroutines
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version.ref = "coroutines" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version.ref = "coroutines" }

# Security
androidx-security-crypto        = { group = "androidx.security",            name = "security-crypto",                 version.ref = "security-crypto" }

# Lifecycle — Compose
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",       version.ref = "lifecycle" }

# CameraX
androidx-camera-core            = { group = "androidx.camera",             name = "camera-core",                     version.ref = "camerax" }
androidx-camera-camera2         = { group = "androidx.camera",             name = "camera-camera2",                  version.ref = "camerax" }
androidx-camera-lifecycle       = { group = "androidx.camera",             name = "camera-lifecycle",                version.ref = "camerax" }
androidx-camera-view            = { group = "androidx.camera",             name = "camera-view",                     version.ref = "camerax" }

# WorkManager
androidx-work-runtime-ktx       = { group = "androidx.work",               name = "work-runtime-ktx",                version.ref = "work" }

# Testing — unit
junit                           = { group = "junit",                       name = "junit",                           version.ref = "junit" }
robolectric                     = { group = "org.robolectric",             name = "robolectric",                     version.ref = "robolectric" }
androidx-test-core              = { group = "androidx.test",               name = "core",                            version.ref = "androidx-test-core" }

# Testing — instrumented
androidx-junit                  = { group = "androidx.test.ext",           name = "junit",                           version.ref = "junit-ext" }
androidx-espresso-core          = { group = "androidx.test.espresso",      name = "espresso-core",                   version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",        version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",        version = "1.9.24-1.0.20" }
